# Service connection configuration
services:
  ads1293:
    host: "127.0.0.1"
    port: 1293
  max30009:
    host: "127.0.0.1"
    port: 30009
  ws2812:
    host: "127.0.0.1"
    port: 2812
  power:
    host: "127.0.0.1"
    port: 501

# Hardware test parameters
max30009_bca:
  sampling_frequency: 400
  current_ua: 64
  frequencies_khz: [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 300, 450]
  duration_per_freq_sec: 5
  polling_interval_sec: 0.5

max30009_icg:
  sampling_frequency: 400
  current_ua: 1.28
  stim_frequency_khz: 20
  resistor_loads_ohm: [20, 100, 200, 300]
  duration_sec: 60
  long_duration_sec: 3600
  polling_interval_sec: 0.5

ads1293_ecg:
  sampling_frequency: 400
  r2_rate: 4
  r3_rate: 16
  bpm_values: [30, 60, 120, 180]
  duration_sec: 60
  long_duration_sec: 3600
  polling_interval_sec: 1.0

# Pass/fail thresholds
thresholds:
  max30009:
    impedance_max_ohm: 3
    resistance_mae_ohm: 2
    reactance_mae_ohm: 1
    phase_angle_mae_deg: 0.2

  ads1293:
    voltage_error_low_uv: 25        # for ref ≤ 500 µV
    voltage_error_high_uv: 40       # for ref > 500 µV
    voltage_error_high_pct: 5
    bpm_error_absolute: 3
    bpm_error_pct: 1

  sampling:
    frequency_error_hz: 1
    sync_counter_tolerance_ms: 50

# Battery test parameters
battery:
  # Discharge test settings
  target_soc_percent: 10.0          # Stop test when SOC reaches this
  max_test_duration_sec: 600        # 10 minutes for quick test
  logging_interval_sec: 5           # Log every 5 seconds
  # Long test settings
  long_target_soc_percent: 5.0
  long_max_duration_sec: 14400      # 4 hours
  long_logging_interval_sec: 60     # Log every minute

# Battery thresholds
battery_thresholds:
  # Temperature limits (Celsius)
  temp_min_operating: 0.0
  temp_max_operating: 45.0
  temp_min_safe: -10.0
  temp_max_safe: 60.0
  # Voltage limits (Volts)
  voltage_full: 4.2
  voltage_nominal: 3.7
  voltage_low: 3.4
  voltage_critical: 3.2
  voltage_empty: 3.0
  # SOC thresholds (percent)
  soc_low: 20.0
  soc_critical: 10.0
  soc_empty: 5.0

# Output paths (on CM4)
output:
  results_dir: "/tmp/test-results"
  data_dir: "/tmp/test-results/data"
  plots_dir: "/tmp/test-results/plots"
  logs_dir: "/tmp/test-results/logs"
