[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Markers for categorizing tests
markers =
    unit: Unit tests (isolated component tests)
    hardware: Hardware integration tests (requires real sensors)
    cm4: CM4 hardware component tests
    storage: Storage/eMMC tests
    gpio: GPIO-related tests
    network: Network/TCP tests
    shutdown: Shutdown handling tests
    mock: Tests using mock objects
    api: Firmware API tests (JSON protocol)
    slow: Long-running tests (>60 seconds)
    quick: Quick tests (<10 seconds)
    ads1293: ADS1293 ECG sensor tests
    max30009: MAX30009 bio-impedance tests
    power: Power service tests
    sync: Synchronization tests
    fw_app: Firmware-application integration tests
    invalid_params: Invalid parameter handling tests
    long: Long-duration tests (>1 hour)

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Timeout for tests (default 5 minutes)
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG
